<text x="64" y="1375" font-family="Urbanist, sans-serif" font-size="24" font-weight="600" fill="#262626">03  Typography rules</text>
<text x="64" y="1414" font-family="Urbanist, sans-serif" font-size="16" font-weight="400" fill="#262626">Use sentence case. Use 14–16px for body text and 12px only for supporting metadata.</text>
<text x="64" y="1447" font-family="Urbanist, sans-serif" font-size="14" font-weight="400" fill="#5D6772">Keep body letter spacing at 0. Use the listed line heights. Avoid mixing Urbanist or Inter in admin UI.</text>
<text x="64" y="1480" font-family="Urbanist, sans-serif" font-size="14" font-weight="400" fill="#5D6772">For amounts and quantities, use tabular numerals where supported and align numeric columns to the right.</text>
<text x="64" y="1519" font-family="Urbanist, sans-serif" font-size="12" font-weight="400" fill="#5D6772">Install Urbanist before import. SVG text editability depends on Figma’s SVG importer.</text>
